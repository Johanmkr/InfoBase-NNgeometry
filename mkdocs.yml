site_name: "Neural Network Geometry"
site_description: "A textbook and literature review generated from a Zotero collection."
site_author: "Johan Kroken"
site_url: ""
repo_url: ""

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

hooks:
  - hooks/citations.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Textbook:
    - textbook/index.md
    # BEGIN textbook-nav (written by textbook-outline; do not edit by hand)
    # END textbook-nav
  - Comparison:
    - comparison/index.md
    - comparison/tables.md
    - comparison/themes.md
  - Papers:
    - papers/index.md
    # BEGIN papers-nav (written by paper-manifest; do not edit by hand)
    # END papers-nav
  - Notation: notation.md
  - References: references.md
