site_name: "Neural Network Geometry"
site_description: "A textbook and literature review generated from a Zotero collection."
site_author: "Johan Kroken"
site_url: ""
repo_url: ""

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

hooks:
  - hooks/citations.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Textbook:
    - textbook/index.md
    # BEGIN textbook-nav (written by textbook-outline; do not edit by hand)
    - "1. Polyhedra, arrangements and piecewise-linear maps": textbook/polyhedral-foundations.md
    - "2. The region complex of a ReLU network": textbook/relu-network-geometry.md
    - "3. Counting linear regions": textbook/counting-regions.md
    - "4. Space folding and folding neurons": textbook/space-folding.md
    - "5. Deep networks as splines": textbook/spline-networks.md
    - "6. Tropical geometry of ReLU networks": textbook/tropical-geometry.md
    - "7. Topology of regions and of data": textbook/region-topology.md
    - "8. Exact enumeration, preimages and verification": textbook/verification-and-preimages.md
    - "9. Information geometry": textbook/information-geometry.md
    - "10. Manifold learning and intrinsic dimension": textbook/manifold-learning.md
    - "11. Riemannian and Finsler geometry of latent spaces": textbook/latent-geometry.md
    - "12. Metric flows with neural networks": textbook/metric-flows.md
    - "13. Symmetry and geometric deep learning": textbook/symmetry-and-gdl.md
